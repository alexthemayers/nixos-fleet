stages:
  - test

variables:
  # nixos/nix already has Nix; NIX_CONFIG is read by the client. sandbox is
  # off because jobs run in rootless Podman (nested user namespaces).
  # max-jobs = 1: one derivation at a time; two NixOS evals OOM proxmox-dev.
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    sandbox = false
    max-jobs = 1
    min-free = 20G
    max-free = 50G
    extra-substituters = https://cache.nixos.org
    extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
  NIXPKGS_ALLOW_UNFREE: "1"
  USER: root

default:
  image:
    name: nixos/nix
    entrypoint: [""]
  timeout: 24h
  interruptible: true
  before_script:
    - export PATH="/nix/var/nix/profiles/default/bin:$PATH"
    - nix build .#ci-tools --out-link .ci-tools
    - export PATH="$CI_PROJECT_DIR/.ci-tools/bin:$PATH"

# Nix lint/fmt/inventory plus ansible-lint. resource_group so this flake
# check does not overlap other Nix work on the 12 GiB builder.
# Deploy is operator-only: docs/adr/2026-11-05-ci-lint-only.md
test:
  stage: test
  needs: []
  resource_group: proxmox-dev-nix
  script:
    - make ci
    - nix build .#packages.x86_64-linux.jellyfin-io-bench --no-link

# Live PromQL against proxmox-observability-debian. Not merge-blocking.
# Schedule in GitLab or run manually from the pipeline UI.
live-promql:
  stage: test
  needs: []
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - when: never
  script:
    - make check-live-promql
