stages:
  - test
  - build
  - verify
  - deploy

variables:
  # nixos/nix already has Nix; NIX_CONFIG is read by the client. sandbox is
  # off because jobs run in rootless Podman (nested user namespaces).
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    sandbox = false
    min-free = 20G
    max-free = 50G
    extra-substituters = http://proxmox-db-1:8080/attic https://cache.nixos.org https://nixos-raspberrypi.cachix.org
    extra-trusted-public-keys = attic:4/oEWZvm70jexTDGnT/Xvv2wlV3cE4utycLPZUSbmAw= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=
  NIXPKGS_ALLOW_UNFREE: "1"
  USER: root
  SSH_CONFIG: |
    # Host keys are pinned from the repo (ssh/fleet_known_hosts), so host key
    # checking stays on for every target.
    Host proxmox-applications-1 proxmox-applications-2 proxmox-observability-1 proxmox-observability-2 proxmox-db-1 proxmox-db-2 proxmox-dev proxmox-lb xcloud-caddy xcloud-postgres rpi4 gaming
      StrictHostKeyChecking yes
      UserKnownHostsFile ~/.ssh/known_hosts
      IdentityFile ~/.ssh/id_ed25519
      ControlMaster auto
      ControlPath ~/.ssh/ssh-%r@%h:%p
      ControlPersist 10m
    Host *
      StrictHostKeyChecking yes

# Files that can change a closure, the CI YAML, or deploy scripts. Docs-only
# commits skip fill/verify/deploy; merge to main still deploys when these match.
.rules-fill:
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|pipeline)$/
    - changes: &nix-relevant-changes
        - "**/*.nix"
        - flake.lock
        - scripts/**/*
        - Makefile
        - .gitlab-ci.yml
        - .sops.yaml
        - secrets/**/*
        - ssh/**/*
        - disko/**/*

.rules-fill-main:
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|pipeline)$/ && $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *nix-relevant-changes

default:
  image:
    name: nixos/nix
    entrypoint: [""]
  timeout: 24h
  interruptible: true
  before_script:
    - export PATH="/nix/var/nix/profiles/default/bin:$PATH"
    - nix build .#ci-tools --out-link .ci-tools
    - export PATH="$CI_PROJECT_DIR/.ci-tools/bin:$PATH"

.setup-ssh: &setup-ssh
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - tr -d '\r' < "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
  - echo "" >> ~/.ssh/id_ed25519
  - chmod 600 ~/.ssh/id_ed25519
  - echo "$SSH_CONFIG" > ~/.ssh/config
  - install -m 600 ssh/fleet_known_hosts ~/.ssh/known_hosts

.require-attic-token: &require-attic-token |
  if [ -z "${ATTIC_TOKEN:-}" ]; then
    echo "ERROR: ATTIC_TOKEN is required"
    exit 1
  fi

# Lint, format, and inventory in one job so they share a single Nix store
# (the runner limit is 4 Docker jobs). needs: [] so this does not wait on
# ATTIC_TOKEN or fill.
test:
  stage: test
  needs: []
  script:
    - make lint fmt-check check-inventory

fill-attic:
  stage: build
  extends: .rules-fill
  needs: []
  interruptible: true
  resource_group: attic-fill
  variables:
    ATTIC_SKIP_IF_CACHED: "1"
  script:
    - *require-attic-token
    - ./scripts/build.sh

# Native aarch64 fill on the Pi. The x86 job only copies the tree over SSH; Nix runs on rpi4.
fill-attic-rpi4:
  stage: build
  extends: .rules-fill-main
  needs: []
  interruptible: true
  resource_group: attic-fill-rpi4
  variables:
    ATTIC_SKIP_IF_CACHED: "1"
  image: debian:trixie-slim
  before_script:
    - apt-get update -yq && apt-get install -yq openssh-client
    - *setup-ssh
  script:
    - *require-attic-token
    - ./scripts/run-on-rpi4.sh ./scripts/build.sh
  allow_failure: true

verify-from-attic:
  stage: verify
  interruptible: true
  needs:
    - job: fill-attic
  script:
    - *require-attic-token
    - ./scripts/verify-from-attic.sh

verify-from-attic-rpi4:
  stage: verify
  extends: .rules-fill-main
  interruptible: true
  needs:
    - job: fill-attic-rpi4
  image: debian:trixie-slim
  before_script:
    - apt-get update -yq && apt-get install -yq openssh-client
    - *setup-ssh
  script:
    - *require-attic-token
    - ./scripts/run-on-rpi4.sh ./scripts/verify-from-attic.sh
  allow_failure: true

.deploy-template: &deploy-template
  stage: deploy
  interruptible: false
  needs:
    - job: verify-from-attic
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|pipeline)$/ && $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *nix-relevant-changes
  variables:
    ATTIC_SKIP_FILL: "1"
  before_script:
    - export PATH="/nix/var/nix/profiles/default/bin:$PATH"
    - nix build .#ci-tools --out-link .ci-tools
    - export PATH="$CI_PROJECT_DIR/.ci-tools/bin:$PATH"
    - *setup-ssh
  script:
    - *require-attic-token
    - ./scripts/deploy-from-attic.sh "$CI_ENVIRONMENT_NAME"

deploy-gaming:
  <<: *deploy-template
  environment:
    name: gaming
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|pipeline)$/ && $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *nix-relevant-changes
      when: manual
      allow_failure: true

deploy-proxmox-applications-1:
  <<: *deploy-template
  environment:
    name: proxmox-applications-1

deploy-proxmox-applications-2:
  <<: *deploy-template
  environment:
    name: proxmox-applications-2

deploy-proxmox-observability-1:
  <<: *deploy-template
  environment:
    name: proxmox-observability-1

deploy-proxmox-observability-2:
  <<: *deploy-template
  environment:
    name: proxmox-observability-2

deploy-proxmox-db-1:
  <<: *deploy-template
  environment:
    name: proxmox-db-1

deploy-proxmox-db-2:
  <<: *deploy-template
  environment:
    name: proxmox-db-2

deploy-proxmox-lb:
  <<: *deploy-template
  environment:
    name: proxmox-lb

deploy-proxmox-dev:
  <<: *deploy-template
  environment:
    name: proxmox-dev

deploy-xcloud-caddy:
  <<: *deploy-template
  environment:
    name: xcloud-caddy

deploy-xcloud-postgres:
  <<: *deploy-template
  environment:
    name: xcloud-postgres

deploy-rpi4:
  stage: deploy
  extends: .rules-fill-main
  interruptible: false
  environment:
    name: rpi4
  needs:
    - job: verify-from-attic-rpi4
  allow_failure: true
  variables:
    ATTIC_SKIP_FILL: "1"
  image: debian:trixie-slim
  before_script:
    - apt-get update -yq && apt-get install -yq openssh-client
    - *setup-ssh
  script:
    - *require-attic-token
    - ./scripts/run-on-rpi4.sh ./scripts/deploy-from-attic.sh rpi4
