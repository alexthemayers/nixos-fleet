stages:
  - prepare
  - test
  - build
  - verify
  - deploy

variables:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    extra-platforms = x86_64-linux aarch64-linux
    min-free = 20G
    max-free = 50G
    extra-substituters = http://proxmox-db-1:8080/attic https://cache.nixos.org https://nixos-raspberrypi.cachix.org
    extra-trusted-public-keys = attic:4/oEWZvm70jexTDGnT/Xvv2wlV3cE4utycLPZUSbmAw= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=
  NIXPKGS_ALLOW_UNFREE: "1"
  NIX_PATH: "$CI_PROJECT_DIR/.nix-defexpr"
  SSH_CONFIG: |
    # Host keys are pinned from the repo (ssh/fleet_known_hosts), so host key
    # checking stays on for every target.
    Host proxmox-applications-1 proxmox-applications-2 proxmox-observability-1 proxmox-observability-2 proxmox-db-1 proxmox-db-2 proxmox-dev proxmox-lb xcloud-caddy xcloud-postgres rpi4 gaming
      StrictHostKeyChecking yes
      UserKnownHostsFile ~/.ssh/known_hosts
      IdentityFile ~/.ssh/id_ed25519
      ControlMaster auto
      ControlPath ~/.ssh/ssh-%r@%h:%p
      ControlPersist 10m
    Host *
      StrictHostKeyChecking yes

.setup-nix: &setup-nix
  - apt-get update -yq && apt-get install -yq curl xz-utils git make openssh-client qemu-user-static
  # Create nixbld group and explicitly add members to the group list in /etc/group
  - curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix/tag/v3.22.2 | sh -s -- install linux --init none --no-confirm --extra-conf "min-free = 0" --extra-conf "max-free = 0" --extra-conf "extra-substituters = http://proxmox-db-1:8080/attic https://cache.nixos.org" --extra-conf "extra-trusted-public-keys = attic:4/oEWZvm70jexTDGnT/Xvv2wlV3cE4utycLPZUSbmAw= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY="
  - export PATH="/nix/var/nix/profiles/default/bin:$PATH"
  # Start the Nix daemon in the background for multi-user mode
  - /nix/var/nix/profiles/default/bin/nix-daemon &
  # Wait briefly for the daemon socket to be ready
  - while [ ! -e /nix/var/nix/daemon-socket/socket ]; do sleep 0.5; done
  # Tell Nix clients to use the daemon
  - export NIX_REMOTE=daemon

default:
  image: debian:trixie-slim
  timeout: 24h
  before_script:
    - *setup-nix

.require-attic-token: &require-attic-token |
  if [ -z "${ATTIC_TOKEN:-}" ]; then
    echo "ERROR: ATTIC_TOKEN is required"
    exit 1
  fi

# Warm the cache. Tests must not need this job (see needs: [] below).
build-devshell:
  stage: prepare
  script:
    - *require-attic-token
    - ATTIC_TOOLING_ONLY=1 ./scripts/build.sh

lint:
  stage: test
  needs: []
  script:
    - nix develop -c make lint

check-inventory:
  stage: test
  needs: []
  script:
    - nix develop -c make check-inventory

format:
  stage: test
  needs: []
  script:
    - make fmt-check

fill-attic:
  stage: build
  needs: []
  variables:
    ATTIC_SKIP_IF_CACHED: "1"
    ATTIC_BUILD_ALL_SYSTEMS: "1"
  script:
    - *require-attic-token
    - ./scripts/build.sh

verify-from-attic:
  stage: verify
  needs:
    - job: fill-attic
  script:
    - *require-attic-token
    - ./scripts/verify-from-attic.sh

.deploy-template: &deploy-template
  stage: deploy
  needs:
    - job: verify-from-attic
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - *setup-nix
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - tr -d '\r' < "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - echo "" >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - echo "$SSH_CONFIG" > ~/.ssh/config
    - install -m 600 ssh/fleet_known_hosts ~/.ssh/known_hosts
  script:
    - *require-attic-token
    - ./scripts/deploy-from-attic.sh "$CI_ENVIRONMENT_NAME"

deploy-gaming:
  <<: *deploy-template
  environment:
    name: gaming
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true

deploy-proxmox-applications-1:
  <<: *deploy-template
  environment:
    name: proxmox-applications-1

deploy-proxmox-applications-2:
  <<: *deploy-template
  environment:
    name: proxmox-applications-2

deploy-proxmox-observability-1:
  <<: *deploy-template
  environment:
    name: proxmox-observability-1

deploy-proxmox-observability-2:
  <<: *deploy-template
  environment:
    name: proxmox-observability-2

deploy-proxmox-db-1:
  <<: *deploy-template
  environment:
    name: proxmox-db-1

deploy-proxmox-db-2:
  <<: *deploy-template
  environment:
    name: proxmox-db-2

deploy-proxmox-lb:
  <<: *deploy-template
  environment:
    name: proxmox-lb

deploy-proxmox-dev:
  <<: *deploy-template
  environment:
    name: proxmox-dev

deploy-xcloud-caddy:
  <<: *deploy-template
  environment:
    name: xcloud-caddy

deploy-xcloud-postgres:
  <<: *deploy-template
  environment:
    name: xcloud-postgres

deploy-rpi4:
  <<: *deploy-template
  environment:
    name: rpi4
