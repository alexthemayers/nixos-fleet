# Mirror of the GitLab gate. GitLab is CI of record
# (docs/adr/2026-11-05-ci-lint-only.md).
name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Realize CI tools
        run: |
          nix build .#ci-tools --out-link .ci-tools
          echo "$GITHUB_WORKSPACE/.ci-tools/bin" >> "$GITHUB_PATH"

      - name: Run gate
        run: make lint fmt-check check-inventory ansible-lint check-jellyfin-xml shellcheck check-obs-config check-secrets-keys test-router-reboot test-check-dashboard-jobs check-docs-links
