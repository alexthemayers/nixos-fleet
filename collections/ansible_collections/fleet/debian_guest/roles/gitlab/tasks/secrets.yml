# debian_guest_secrets is the decrypted sops file, loaded once per play.
- name: Install gitlab-secrets.json
  ansible.builtin.copy:
    dest: /etc/gitlab/gitlab-secrets.json
    mode: "0600"
    content: "{{ debian_guest_gitlab_rails_secrets | to_nice_json }}\n"
  vars:
    debian_guest_gitlab_rails_secrets:
      gitlab_rails:
        secret_key_base: "{{ debian_guest_secrets.gitlab.secret }}"
        otp_key_base: "{{ debian_guest_secrets.gitlab.otp }}"
        db_key_base: "{{ debian_guest_secrets.gitlab.db_encryption_secret }}"
        openid_connect_signing_key: "{{ debian_guest_secrets.gitlab.jws }}"
        active_record_encryption_primary_key: "{{ debian_guest_secrets.gitlab.active_record.primary }}"
        active_record_encryption_deterministic_key: "{{ debian_guest_secrets.gitlab.active_record.deterministic }}"
        active_record_encryption_key_derivation_salt: "{{ debian_guest_secrets.gitlab.active_record.salt }}"
  no_log: true
  notify: Reconfigure GitLab

- name: Install the other GitLab secret files
  ansible.builtin.copy:
    dest: "/etc/gitlab/{{ item.dest }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0600') }}"
    content: "{{ item.content }}\n"
  loop:
    - { dest: db_password, content: "{{ debian_guest_secrets.postgres.gitlab_password }}" }
    - { dest: oidc_client_secret, content: "{{ debian_guest_secrets.gitlab.client_secret }}" }
    - { dest: registry.crt, content: "{{ debian_guest_secrets.gitlab.registry_cert }}", mode: "0444" }
    - { dest: registry.key, content: "{{ debian_guest_secrets.gitlab.registry_key }}", group: gitlab, mode: "0440" }
    - { dest: ssh_backup_key, content: "{{ debian_guest_secrets.ssh_backup.privkey }}", owner: gitlab, group: gitlab, mode: "0400" }
  loop_control:
    label: "{{ item.dest }}"
  no_log: true
  notify: Reconfigure GitLab

- name: Install gitlab.rb
  ansible.builtin.template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
    mode: "0600"
  notify: Reconfigure GitLab
