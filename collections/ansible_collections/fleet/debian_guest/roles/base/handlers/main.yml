---
- name: Update base apt cache
  listen: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0

- name: Restart ssh
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Update GRUB
  ansible.builtin.command:
    argv: [update-grub]
  changed_when: true

- name: Restart apt-daily-upgrade timer
  ansible.builtin.systemd:
    name: apt-daily-upgrade.timer
    state: restarted
    daemon_reload: true
