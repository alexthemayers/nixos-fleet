---
# Prowlarr runs as a rootless Podman unit (home-operations image; linuxserver
# s6 fails under keep-id). Host networking keeps FlareSolverr at 127.0.0.1:8191.

- name: Give Prowlarr ownership of its library
  ansible.builtin.import_tasks: own-tree.yml
  vars:
    own_path: /mnt/nfs/media/arr-stack/prowlarr
    own_user: prowlarr
    own_group: media
    own_mode: "0770"

- name: Cut Prowlarr over to rootless Podman
  ansible.builtin.include_tasks: container.yml
  vars:
    item: "{{ debian_guest_podman_apps | selectattr('name', 'equalto', 'prowlarr') | first }}"
