---
# Radarr runs as a rootless Podman unit (home-operations image; linuxserver
# s6 fails under keep-id). Host networking keeps qBittorrent and Jellyfin on
# 127.0.0.1.

- name: Give Radarr ownership of its library
  ansible.builtin.import_tasks: own-tree.yml
  vars:
    own_path: /mnt/nfs/media/arr-stack/radarr
    own_user: radarr
    own_group: media
    own_mode: "0770"

- name: Cut Radarr over to rootless Podman
  ansible.builtin.include_tasks: container.yml
  vars:
    item: "{{ debian_guest_podman_apps | selectattr('name', 'equalto', 'radarr') | first }}"
