---
# Vaultwarden runs as a rootless Podman unit. Data lives under
# /var/lib/vaultwarden; a pre-cut-over tarball was /root/vaultwarden-pre-phase3.tgz.

- name: Create the Vaultwarden data directory
  ansible.builtin.file:
    path: /var/lib/vaultwarden
    state: directory
    owner: vaultwarden
    group: vaultwarden
    mode: "0750"

- name: Give Vaultwarden ownership of its data
  ansible.builtin.import_tasks: own-tree.yml
  vars:
    own_path: /var/lib/vaultwarden
    own_user: vaultwarden
    own_group: vaultwarden
    own_mode: "0750"

- name: Install the Vaultwarden environment file
  ansible.builtin.copy:
    dest: /etc/vaultwarden.env
    owner: root
    group: vaultwarden
    mode: "0640"
    content: |
      {{ debian_guest_secrets.vaultwarden.env | trim }}
      DOMAIN=https://vaultwarden.alexmayers.co.za
      ROCKET_PORT=8222
      ROCKET_ADDRESS=0.0.0.0
      SIGNUPS_ALLOWED=false
      EXPERIMENTAL_CLIENT_FEATURE_FLAGS=ssh-key-vault-item,ssh-agent
  no_log: true

- name: Cut Vaultwarden over to rootless Podman
  ansible.builtin.include_tasks: container.yml
  vars:
    item: "{{ debian_guest_podman_apps | selectattr('name', 'equalto', 'vaultwarden') | first }}"
