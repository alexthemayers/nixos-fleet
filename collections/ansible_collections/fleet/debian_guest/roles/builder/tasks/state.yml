---
- name: See which builder trees were extracted
  ansible.builtin.stat:
    path: "{{ debian_guest_state_dir }}/{{ item.src }}"
  loop:
    - { src: backup-relay, dest: /var/backup-relay, user: backup-relay }
  loop_control:
    label: "{{ item.src }}"
  register: debian_guest_builder_staged

- name: Copy a builder tree onto the guest
  when: item.stat.exists
  ansible.builtin.copy:
    src: "{{ debian_guest_state_dir }}/{{ item.item.src }}/"
    dest: "{{ item.item.dest }}/"
    owner: "{{ item.item.user }}"
    group: "{{ item.item.user }}"
    mode: "0750"
    remote_src: true
  loop: "{{ debian_guest_builder_staged.results }}"
  loop_control:
    label: "{{ item.item.src }}"
