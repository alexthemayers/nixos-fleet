receivers:
  - name: "ntfy"
    webhook_configs:
      - send_resolved: true
        url: "http://127.0.0.1:8095/"
route:
  group_by:
    - "alertname"
    - "host"
    - "job"
  group_interval: "5m"
  group_wait: "30s"
  receiver: "ntfy"
  repeat_interval: "12h"
  routes:
    - group_by:
        - "alertname"
        - "instance"
        - "device"
      group_interval: "5m"
      group_wait: "30s"
      matchers:
        - "alertname=~\"NodeFilesystemAlmostOutOfSpace|NodeFilesystemSpaceFillingUp\""
      receiver: "ntfy"
      repeat_interval: "12h"
