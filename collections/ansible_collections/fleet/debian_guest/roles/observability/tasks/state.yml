---
- name: See which state trees were extracted
  ansible.builtin.stat:
    path: "/root/obs-state/{{ item.src }}"
  loop:
    - { src: ntfy-sh, dest: /var/lib/ntfy-sh, user: ntfy }
    - { src: grafana, dest: /var/lib/grafana, user: grafana }
    - { src: alertmanager, dest: /var/lib/alertmanager, user: alertmanager }
    - { src: alertmanager-prom, dest: /var/lib/alertmanager, user: alertmanager }
    - { src: loki, dest: /var/lib/loki, user: loki }
  loop_control:
    label: "{{ item.src }}"
  register: debian_guest_staged_state

- name: Copy a state tree onto the guest
  when: item.stat.exists
  ansible.builtin.copy:
    src: "/root/obs-state/{{ item.item.src }}/"
    remote_src: true
    dest: "{{ item.item.dest }}/"
    owner: "{{ item.item.user }}"
    group: "{{ item.item.user }}"
    mode: "0750"
  loop: "{{ debian_guest_staged_state.results }}"
  loop_control:
    label: "{{ item.item.src }}"

- name: Record that state was imported
  ansible.builtin.file:
    path: /var/lib/observability-state-imported
    state: touch
    owner: root
    group: root
    mode: "0644"
