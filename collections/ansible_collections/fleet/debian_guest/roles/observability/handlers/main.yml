---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart alertmanager-ntfy
  ansible.builtin.systemd:
    name: alertmanager-ntfy
    state: restarted

# Lifecycle is enabled on Prometheus (--web.enable-lifecycle). Prefer reload
# so a rules or scrape edit does not drop the TSDB head. Retries cover the
# first-apply race where this handler flushes before the container listens.
- name: Reload Prometheus
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/-/reload
    method: POST
    status_code: [200]
  register: debian_guest_prometheus_reload
  retries: 5
  delay: 2
  until: debian_guest_prometheus_reload is succeeded

- name: Restart Alertmanager
  ansible.builtin.systemd:
    name: alertmanager
    state: restarted

- name: Restart Loki
  ansible.builtin.systemd:
    name: loki
    state: restarted

- name: Restart ntfy
  ansible.builtin.systemd:
    name: ntfy
    state: restarted

- name: Restart blackbox
  ansible.builtin.systemd:
    name: blackbox
    state: restarted

- name: Restart graphite-exporter
  ansible.builtin.systemd:
    name: graphite-exporter
    state: restarted
