---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart alertmanager-ntfy
  ansible.builtin.systemd:
    name: alertmanager-ntfy
    state: restarted
    daemon_reload: true

# prometheus.yml and rules.yaml are bind-mounted into the container as single
# files, and `copy` replaces a file with a new inode, so the container keeps
# reading the old one. POST /-/reload then re-reads stale content (it did, from
# 2026-11-06, until a restart). Restart so the mounts are re-resolved; the
# WAL replays in seconds.
- name: Restart Prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted
    daemon_reload: true

- name: Restart Alertmanager
  ansible.builtin.systemd:
    name: alertmanager
    state: restarted
    daemon_reload: true

- name: Restart Loki
  ansible.builtin.systemd:
    name: loki
    state: restarted
    daemon_reload: true

- name: Restart ntfy
  ansible.builtin.systemd:
    name: ntfy
    state: restarted
    daemon_reload: true

- name: Restart blackbox
  ansible.builtin.systemd:
    name: blackbox
    state: restarted
    daemon_reload: true

- name: Restart graphite-exporter
  ansible.builtin.systemd:
    name: graphite-exporter
    state: restarted
    daemon_reload: true
