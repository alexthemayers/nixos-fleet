[defaults]
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
host_key_checking = True

[ssh_connection]
pipelining = True
ssh_args = -o KexAlgorithms=curve25519-sha256 -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15 -o ServerAliveCountMax=4
