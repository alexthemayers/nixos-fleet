---
# Shared by the hypervisor play and the guests. Public keys match
# ansible/group_vars/all/vars.yml and config/users.nix. Not secrets.
# Per-guest values live in host_vars/. Role-private values live in the
# role's defaults/.

system_timezone: Africa/Johannesburg
system_locale: en_US.UTF-8

debian_guest_nameserver: 192.168.3.1
debian_guest_searchdomain: alexthemayers.com

debian_guest_ssh_keys:
  - "ssh-rsa  a.mayers102@gmail.com"
  - "ssh-rsa  root@proxmox"

# linux-image-amd64 replaces the cloud kernel, which does not ship iavf.
debian_guest_packages:
  - firmware-misc-nonfree
  - linux-image-amd64
  - qemu-guest-agent
