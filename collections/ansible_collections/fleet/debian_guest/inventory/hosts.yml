---
# One inventory for both guests. Run site.yml with --limit <guest>.
all:
  children:
    hypervisor:
      hosts:
        proxmox:
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3
          # Hostname from SSH config. Set PROXMOX_ANSIBLE_HOST when that
          # name does not resolve (tailnet address, still not committed).
          ansible_host: "{{ lookup('env', 'PROXMOX_ANSIBLE_HOST') | default('proxmox', true) }}"
    debian_guests:
      children:
        apps_guests:
          hosts:
            proxmox-applications-debian:
        gitlab_guests:
          hosts:
            proxmox-gitlab-debian:
        obs_guests:
          hosts:
            proxmox-observability-debian:
        dev_guests:
          hosts:
            proxmox-dev-debian:
