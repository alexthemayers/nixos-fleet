---
# =============================================================================
# Role: smartctl_exporter — tasks
# Installs smartctl_exporter from GitHub releases to /opt/smartctl_exporter.
# Deploys the systemd service unit and manages its state.
# =============================================================================

- name: Ensure /opt/smartctl_exporter directory exists
  ansible.builtin.file:
    path: /opt/smartctl_exporter
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download smartctl_exporter {{ smartctl_exporter_version }}
  ansible.builtin.get_url:
    url: "{{ smartctl_exporter_download_url }}"
    dest: "/tmp/smartctl_exporter-{{ smartctl_exporter_version }}.linux-amd64.tar.gz"
    checksum: "{{ smartctl_exporter_checksum }}"
    mode: "0644"

- name: Extract smartctl_exporter {{ smartctl_exporter_version }} to /opt/
  ansible.builtin.unarchive:
    src: "/tmp/smartctl_exporter-{{ smartctl_exporter_version }}.linux-amd64.tar.gz"
    dest: /opt/
    remote_src: yes
    creates: "/opt/smartctl_exporter-{{ smartctl_exporter_version }}.linux-amd64/smartctl_exporter"
    owner: root
    group: root

- name: Symlink smartctl_exporter binary to /usr/local/bin/smartctl_exporter
  ansible.builtin.file:
    src: "/opt/smartctl_exporter-{{ smartctl_exporter_version }}.linux-amd64/smartctl_exporter"
    dest: /usr/local/bin/smartctl_exporter
    state: link
    force: yes
  notify: restart smartctl_exporter

- name: Deploy smartctl_exporter.service unit file
  ansible.builtin.copy:
    src: smartctl_exporter.service
    dest: /etc/systemd/system/smartctl_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart smartctl_exporter

- name: Flush handlers to reload systemd if unit changed
  ansible.builtin.meta: flush_handlers

- name: Enable and start smartctl_exporter service
  ansible.builtin.systemd:
    name: smartctl_exporter
    enabled: yes
    state: started
