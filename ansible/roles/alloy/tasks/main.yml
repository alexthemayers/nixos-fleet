---
# =============================================================================
# Role: alloy — tasks
# Installs Grafana Alloy, configures systemd journal log forwarding to Loki,
# and ensures the alloy service is running.
# =============================================================================

- name: Install alloy package
  ansible.builtin.apt:
    name: alloy
    state: present

- name: Deploy /etc/default/alloy configuration
  ansible.builtin.copy:
    dest: /etc/default/alloy
    owner: root
    group: root
    mode: "0644"
    content: |
      # Configuration file for the Alloy systemd service.
      # Managed by Ansible — do not edit manually. See ansible/roles/alloy/

      CUSTOM_ARGS="--server.http.listen-addr=0.0.0.0:12345"
      CONFIG_FILE="/etc/alloy/config.alloy"
      RESTART_ON_UPGRADE=true
  notify: restart alloy

- name: Ensure /etc/alloy directory exists
  ansible.builtin.file:
    path: /etc/alloy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy /etc/alloy/config.alloy
  ansible.builtin.copy:
    src: config.alloy
    dest: /etc/alloy/config.alloy
    owner: root
    group: root
    mode: "0644"
  notify: restart alloy

- name: Flush handlers before ensuring alloy service state
  ansible.builtin.meta: flush_handlers

- name: Enable and start alloy service
  ansible.builtin.systemd:
    name: alloy
    enabled: yes
    state: started
