# Managed by Ansible — do not edit manually. See ansible/roles/systemd_exporter/
# Drop-in override for systemd_exporter.service.
#
# Limits systemd_exporter unit scraping to reduce D-Bus load.
# Without this filter, systemd_exporter queries ALL units (including scopes,
# devices, slices, and transient units), generating 1500+ D-Bus
# max_replies_per_connection errors per boot — even after raising the limit
# to 1024 in /etc/dbus-1/system-local.conf.
#
# This filter restricts scraping to the five meaningful unit types:
#   .service  — long-running daemons and oneshot units
#   .socket   — socket-activated units
#   .target   — synchronisation points (multi-user.target etc.)
#   .timer    — cron-like scheduled units
#   .mount    — filesystem mount units
#   .swap     — swap units
[Service]
ExecStart=
ExecStart=/usr/local/bin/systemd_exporter --systemd.collector.unit-include=.+[.](service|socket|target|timer|mount|swap)
