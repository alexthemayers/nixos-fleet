---
# =============================================================================
# Role: apt_repos — tasks
# Configures APT keyrings, repositories, and mirror lists for Proxmox VE,
# Debian base (trixie), Vector, and Tailscale.
# =============================================================================

# ---------------------------------------------------------------------------
# Keyring directories
# ---------------------------------------------------------------------------

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure /usr/share/keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

# ---------------------------------------------------------------------------
# Repository GPG keys
# ---------------------------------------------------------------------------

- name: Download Datadog APT keys for Vector
  ansible.builtin.get_url:
    url: "https://keys.datadoghq.com/{{ item }}"
    dest: "/tmp/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - DATADOG_APT_KEY_CURRENT.public
    - DATADOG_APT_KEY_C0962C7D.public
    - DATADOG_APT_KEY_F14F620E.public
  register: datadog_keys

# Always re-export. A leftover gnupg keybox (size > 0) is unreadable by
# Debian trixie's sqv; `gpg --import --keyring` wrote that format once.
- name: Import Datadog APT keys into the Vector keyring
  ansible.builtin.shell: |
    set -euo pipefail
    tmpdir=$(mktemp -d)
    chmod 700 "$tmpdir"
    gpg --homedir "$tmpdir" --batch --import \
      /tmp/DATADOG_APT_KEY_CURRENT.public \
      /tmp/DATADOG_APT_KEY_C0962C7D.public \
      /tmp/DATADOG_APT_KEY_F14F620E.public
    gpg --homedir "$tmpdir" --batch --export \
      > /usr/share/keyrings/datadog-archive-keyring.gpg
    chmod 0644 /usr/share/keyrings/datadog-archive-keyring.gpg
    rm -rf "$tmpdir"
  notify: update apt cache

- name: Download Tailscale GPG key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/bookworm.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"
  notify: update apt cache

# ---------------------------------------------------------------------------
# APT repository source files
# ---------------------------------------------------------------------------

- name: Deploy /etc/apt/sources.list (Debian trixie base repositories)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible — do not edit manually. See ansible/roles/apt_repos/
      deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware
      deb http://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware
      deb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
  notify: update apt cache

- name: Deploy /etc/apt/sources.list.d/proxmox.sources (PVE no-subscription repository)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible — do not edit manually. See ansible/roles/apt_repos/
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: trixie
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
  notify: update apt cache

- name: Deploy /etc/apt/sources.list.d/pve-enterprise.sources (disabled)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-enterprise.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible — do not edit manually. See ansible/roles/apt_repos/
      Types: deb
      URIs: https://enterprise.proxmox.com/debian/pve
      Suites: trixie
      Components: pve-enterprise
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
      Enabled: false
  notify: update apt cache

- name: Deploy /etc/apt/sources.list.d/pve-test.sources (disabled)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-test.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible — do not edit manually. See ansible/roles/apt_repos/
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: trixie
      Components: pve-test
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
      Enabled: false
  notify: update apt cache

- name: Deploy /etc/apt/sources.list.d/ceph.list (commented out)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/ceph.list
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible — do not edit manually. See ansible/roles/apt_repos/
      # Ceph repository is currently disabled on this standalone host.
      # deb http://download.proxmox.com/debian/ceph-squid trixie no-subscription
  notify: update apt cache

- name: Deploy /etc/apt/sources.list.d/vector.list
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/vector.list
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible — do not edit manually. See ansible/roles/apt_repos/
      deb [signed-by=/usr/share/keyrings/datadog-archive-keyring.gpg] https://apt.vector.dev/ stable vector-0
  notify: update apt cache

- name: Remove leftover Grafana APT repository (Alloy)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/grafana.list
    - /etc/apt/keyrings/grafana.gpg
  notify: update apt cache

- name: Deploy /etc/apt/sources.list.d/tailscale.list
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible — do not edit manually. See ansible/roles/apt_repos/
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian bookworm main
  notify: update apt cache

- name: Ensure legacy pve-enterprise.list is commented out
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-enterprise.list
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible — enterprise repo is disabled in pve-enterprise.sources
      # deb https://enterprise.proxmox.com/debian/pve trixie pve-enterprise
  notify: update apt cache

- name: Flush handlers to update APT cache immediately if repositories changed
  ansible.builtin.meta: flush_handlers
