---
# Group variables for the proxmox host group
# Managed by Ansible — see ansible/group_vars/all/vars.yml

# ---------------------------------------------------------------------------
# System / Host Baseline Configuration
# ---------------------------------------------------------------------------
system_timezone: "Africa/Johannesburg"
system_locale: "en_US.UTF-8"
sysctl_watchdog_thresh: 30

ssh_authorized_keys:
  - "ssh-rsa  a.mayers102@gmail.com"
  - "ssh-rsa  root@proxmox"

# ---------------------------------------------------------------------------
# Base & Diagnostic Packages
# ---------------------------------------------------------------------------
base_packages:
  # System administration & shells
  - neovim
  - tmux
  - zsh
  - ncdu
  - htop
  # Hardware & power monitoring / control
  - smartmontools
  - lm-sensors
  - rasdaemon
  - powertop
  - sysfsutils
  # Networking & troubleshooting
  - iperf3
  - tcpdump
  - traceroute
  - nmap
  - lsof
  - strace
  - socat
  - net-tools
  - ethtool
  - pciutils
  - usbutils
  - bind9-dnsutils
  - rsync
  - curl
  - wget
  # Intel GPU tools & VA-API drivers
  - intel-gpu-tools
  - vainfo
  - intel-media-va-driver
  # DKMS build dependencies
  - build-essential
  - dkms
  - git
  # Realtek 2.5G NIC DKMS driver (r8169 is blacklisted but r8125 is kept
  # installed for potential future use — the NIC is currently disabled)
  - r8125-dkms
  # Intel CPU microcode update tools
  - intel-microcode
  - iucode-tool
  # Prometheus node metrics
  - prometheus-node-exporter

# ---------------------------------------------------------------------------
# Kernel / Grub
# ---------------------------------------------------------------------------
grub_cmdline: "quiet bert_disable=0 mce=1 intel_iommu=on iommu=pt i915.enable_guc=3 i915.max_vfs=3 i915.force_probe=7d67 module_blacklist=xe"

# Kernel modules to load at boot
kernel_modules:
  - vfio
  - vfio_iommu_type1
  - vfio_pci
  - coretemp
# NOTE: vfio_virqfd intentionally omitted — merged into vfio in Linux 6.2+

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------
network_bridge_address: "192.168.3.100/24"
network_bridge_gateway: "192.168.3.1"
network_mtu: 9000

# ---------------------------------------------------------------------------
# iGPU passthrough
# ---------------------------------------------------------------------------
igpu_pci_id: "0000:00:02.0"
igpu_device_id: "8086:7d67"

# ---------------------------------------------------------------------------
# SR-IOV (Intel X710 on enp2s0f1np1)
# ---------------------------------------------------------------------------
sriov_pf_interface: "enp2s0f1np1"
sriov_num_vfs: 16

# ---------------------------------------------------------------------------
# Tailscale
# ---------------------------------------------------------------------------
tailscaled_port: "41639"

# ---------------------------------------------------------------------------
# ZFS
# ---------------------------------------------------------------------------
zfs_arc_max_bytes: 10068426752  # ~9.4 GB

# ---------------------------------------------------------------------------
# D-Bus
# ---------------------------------------------------------------------------
dbus_max_replies: 1024

# ---------------------------------------------------------------------------
# Monitoring
# ---------------------------------------------------------------------------
cpu_temp_high_threshold: 85

# ---------------------------------------------------------------------------
# systemd_exporter
# ---------------------------------------------------------------------------
systemd_exporter_version: "0.7.0"
systemd_exporter_checksum: "sha256:2d995ca20249aeeac8f507173176ce5d162f17470a98ca66e289c85b388480c3"
systemd_exporter_download_url: "https://github.com/prometheus-community/systemd_exporter/releases/download/v0.7.0/systemd_exporter-0.7.0.linux-amd64.tar.gz"

# ---------------------------------------------------------------------------
# smartctl_exporter
# ---------------------------------------------------------------------------
smartctl_exporter_version: "0.14.0"
smartctl_exporter_checksum: "sha256:875983cd27affc5a682401930e5a8eea3f06c325fe6d6a7228c5547d882685b3"
smartctl_exporter_download_url: "https://github.com/prometheus-community/smartctl_exporter/releases/download/v0.14.0/smartctl_exporter-0.14.0.linux-amd64.tar.gz"

# ---------------------------------------------------------------------------
# Kernel cleanup
# ---------------------------------------------------------------------------
# Number of most recent kernel meta-packages to keep when purging old kernels.
kernel_cleanup_keep: 2
